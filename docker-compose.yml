services:
  runmanager-db:
    image: postgres:16-alpine
    container_name: runmanager-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: runmanagerdb
    ports:
      - "5432:5432"
    volumes:
      - runmanagerdb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d runmanagerdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  runmanagerdb_pgdata:
    driver: local
